name: 网站问题 / Site issue
description: 天机盘页面显示、排盘或 AI 解读等使用问题
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: 出问题的页面地址
      placeholder: https://tianjipan.tech/……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么出现的
      placeholder: 点了什么、填了什么、看到什么报错
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 浏览器与系统
      placeholder: 例：Windows 11 / Chrome 153 / 公司网络开了代理
  - type: textarea
    id: screenshot
    attributes:
      label: 截图
      description: 请勿贴出手机号、验证码、他人的生辰等隐私信息。
